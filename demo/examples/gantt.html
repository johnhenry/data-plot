<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../src/index.css" />
<script type="module" src="../../src/global.mjs"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  data-plot { --plot-margin: 28px 16px 36px 90px; --plot-height: 240px; }
  /* x2 makes a range: the default CSS stretches each mark from start to end. */
  .task {
    block-size: calc(var(--bandheight) * 100%);
    background: var(--color);
    border-radius: 4px;
    font-size: 11px;
    color: white;
    padding-inline: 6px;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
  }
  .milestone { inline-size: 12px; block-size: 12px; rotate: 45deg; background: CanvasText; }
</style>
</head>
<body>
<!-- A datalist: one option per task. label and value are built in; any
     data-* attribute is another field (data-team is "team"). -->
<datalist id="plan">
  <option label="Research" data-team="Design" data-start="0" data-end="3"></option>
  <option label="Prototype" data-team="Design" data-start="2" data-end="6" data-due="6"></option>
  <option label="Build" data-team="Engineering" data-start="5" data-end="12"></option>
  <option label="Test" data-team="Engineering" data-start="10" data-end="14" data-due="14"></option>
  <option label="Launch" data-team="Marketing" data-start="13" data-end="16" data-due="16"></option>
</datalist>

<data-plot src="#plan" x-domain="0 auto" y-padding="0.3" aria-label="Project plan: five tasks across sixteen weeks, from research to launch">
  <plot-axis scale="x" label="Week" grid></plot-axis>
  <plot-axis scale="y"></plot-axis>
  <plot-marks x="start" x2="end" y="label" color="team" key="label">
    <template><div class="task" title="{label}: weeks {start}–{end}">{team}</div></template>
  </plot-marks>
  <!-- A second layer on the same scales: a diamond at each due date. -->
  <plot-marks x="due" y="label"><template><span class="milestone"></span></template></plot-marks>
  <plot-legend></plot-legend>
</data-plot>
<button id="slip">Build slips two weeks</button>
<script type="module">
  // Edit the datalist and the plot follows.
  document.querySelector("#slip").onclick = () => {
    const build = document.querySelector('option[label="Build"]');
    build.dataset.end = build.dataset.end === "12" ? "14" : "12";
  };
</script>
</body>
</html>
