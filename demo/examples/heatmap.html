<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../src/index.css" />
<script type="module" src="../../src/global.mjs"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  data-plot { --plot-margin: 28px 8px 24px 56px; --plot-height: 220px; }
  /* A heatmap cell is a mark the size of its band in both directions. */
  data-plot > plot-marks > .cell {
    inline-size: calc(var(--bandwidth) * 100%);
    block-size: calc(var(--bandheight) * 100%);
    background: var(--color);
    border-radius: 3px;
    display: grid;
    place-items: center;
    font-size: 11px;
    color: #111;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff;
  }
</style>
</head>
<body>
<!-- The data is the table you'd write anyway: a row per city, a column per
     month. column-field and value-field say how to read it: each column
     header is a month, each cell is mm of rain. -->
<data-plot column-field="month" value-field="mm" x-padding="0.08" y-padding="0.08">
  <table>
    <caption>Rainfall (mm)</caption>
    <thead><tr><th>city</th><th>Jan</th><th>Mar</th><th>May</th><th>Jul</th><th>Sep</th><th>Nov</th></tr></thead>
    <tbody>
      <tr><th>Rome</th><td>67</td><td>58</td><td>38</td><td>15</td><td>69</td><td>113</td></tr>
      <tr><th>London</th><td>55</td><td>41</td><td>49</td><td>45</td><td>49</td><td>59</td></tr>
      <tr><th>Bergen</th><td>250</td><td>180</td><td>110</td><td>140</td><td>260</td><td>280</td></tr>
    </tbody>
  </table>
  <plot-axis scale="x"></plot-axis>
  <plot-axis scale="y"></plot-axis>
  <plot-marks x="month" y="city" color="mm">
    <template><div class="cell" title="{city}, {month}: {mm} mm">{mm}</div></template>
  </plot-marks>
  <plot-legend label="mm"></plot-legend>
</data-plot>
</body>
</html>
