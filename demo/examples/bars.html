<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../src/index.css" />
<script type="module" src="../../src/global.mjs"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  data-plot { --plot-margin: 16px 16px 32px 40px; --plot-height: 250px; }
  /* There's no bar element: a bar is a mark that CSS stretches down to
     the axis. --y is its height, --bandwidth its share of the width. */
  data-plot > plot-marks > .bar {
    bottom: 0;
    translate: -50% 0;
    block-size: calc(var(--y) * 100%);
    inline-size: calc(var(--bandwidth) * 100%);
    background: var(--color, steelblue);
    border-radius: 3px 3px 0 0;
  }
  .bar span { position: absolute; inset-inline: 0; bottom: 100%; text-align: center; font-size: 11px; }
</style>
</head>
<body>
<!-- A datalist holds data without showing it: each option's label and value. -->
<data-plot y-domain="0 auto" aria-label="Cups of coffee per day, Monday to Friday">
  <datalist>
    <option label="Mon" value="3"></option>
    <option label="Tue" value="5"></option>
    <option label="Wed" value="2"></option>
    <option label="Thu" value="6"></option>
    <option label="Fri" value="4"></option>
  </datalist>
  <plot-axis scale="y" grid ticks="3"></plot-axis>
  <plot-axis scale="x"></plot-axis>
  <plot-marks x="label" y="value" key="label">
    <template><div class="bar"><span>{value}</span></div></template>
  </plot-marks>
</data-plot>

<button id="more">Another week</button>
<script type="module">
  // From script: .data replaces the rows (until src changes). Bars keep their
  // element (key="label"), so they grow and shrink.
  const plot = document.querySelector("data-plot");
  document.querySelector("#more").onclick = () => {
    plot.data = plot.data.map((row) => ({ ...row, value: 1 + Math.floor(Math.random() * 8) }));
  };
</script>
</body>
</html>
