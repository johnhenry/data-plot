<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../src/index.css" />
<script type="module" src="../../src/global.mjs"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  data-plot { --plot-margin: 28px 16px 40px 48px; --plot-height: 250px; }
</style>
</head>
<body>
<!-- The data is an ordinary table. It stays readable by screen readers;
     the plot draws it. Edit a cell and the plot follows. -->
<data-plot>
  <table>
    <thead><tr><th>city</th><th>region</th><th>rain</th><th>sun</th><th>people</th></tr></thead>
    <tbody>
      <tr><td>Lisbon</td><td>South</td><td>690</td><td>2800</td><td>545</td></tr>
      <tr><td>Madrid</td><td>South</td><td>420</td><td>2770</td><td>3330</td></tr>
      <tr><td>Rome</td><td>South</td><td>800</td><td>2470</td><td>2750</td></tr>
      <tr><td>Paris</td><td>West</td><td>640</td><td>1660</td><td>2100</td></tr>
      <tr><td>London</td><td>West</td><td>600</td><td>1410</td><td>8800</td></tr>
      <tr><td>Dublin</td><td>West</td><td>760</td><td>1450</td><td>590</td></tr>
      <tr><td>Oslo</td><td>North</td><td>760</td><td>1670</td><td>700</td></tr>
      <tr><td>Helsinki</td><td>North</td><td>650</td><td>1860</td><td>660</td></tr>
      <tr><td>Bergen</td><td>North</td><td>2250</td><td>1200</td><td>290</td></tr>
    </tbody>
  </table>
  <plot-axis scale="x" label="Rain (mm/yr)" grid></plot-axis>
  <plot-axis scale="y" label="Sun (h/yr)" grid></plot-axis>
  <!-- No template: each row is a dot. -->
  <plot-marks x="rain" y="sun" color="region" size="people" key="city"></plot-marks>
  <plot-legend></plot-legend>
</data-plot>

<button id="wetter">Bergen gets drier</button>
<script type="module">
  // Changing the table is all it takes; the dot animates to its new place.
  document.querySelector("#wetter").onclick = () => {
    const cell = document.querySelector("tbody tr:last-child td:nth-child(3)");
    cell.textContent = cell.textContent === "2250" ? "900" : "2250";
  };
</script>
</body>
</html>
