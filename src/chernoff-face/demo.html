<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>chernoff-face</title>
<link rel="stylesheet" href="../index.css" />
<link rel="stylesheet" href="./index.css" />
<script type="module" src="../global.mjs"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 12px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  figure { margin: 0; text-align: center; }
  data-plot { inline-size: 360px; --plot-height: 220px; --plot-margin: 20px 20px 28px 32px; margin-block-start: 16px; }
  data-plot chernoff-face { inline-size: 32px; block-size: 32px; }
</style>
</head>
<body>
<div class="row">
  <figure><chernoff-face></chernoff-face><figcaption>neutral</figcaption></figure>
  <figure><chernoff-face smile="1" eye-size="0.7" brow-slant="0.7"></chernoff-face><figcaption>happy</figcaption></figure>
  <figure><chernoff-face smile="0" brow-slant="0" eye-size="0.3" pupil-size="0.2"></chernoff-face><figcaption>cross</figcaption></figure>
  <figure><chernoff-face mouth-open="1" eye-size="1" pupil-size="0.2" brow-slant="1" smile="0.6"></chernoff-face><figcaption>surprised</figcaption></figure>
  <figure><chernoff-face gaze="1" smile="0.4" brow-slant="0.2" eye-size="0.4"></chernoff-face><figcaption>suspicious</figcaption></figure>
</div>

<p>Faces as marks: a <code>&lt;data-plot&gt;</code> whose template is a <code>&lt;chernoff-face&gt;</code>, with fields mapped onto features by <code>:attr</code>.</p>
<data-plot id="plot" aria-label="Ten teams: velocity against morale">
  <plot-axis scale="x" grid></plot-axis>
  <plot-axis scale="y" grid></plot-axis>
  <plot-marks x="velocity" y="morale">
    <template><chernoff-face :smile="morale" :eye-size="focus" :brow-slant="risk" aria-label="{team}"></chernoff-face></template>
  </plot-marks>
</data-plot>
<script type="module">
  const random = (seed) => () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const next = random(7);
  document.getElementById("plot").data = Array.from({ length: 10 }, (_, i) => ({
    team: `Team ${i + 1}`,
    velocity: 1 + i,
    morale: Math.round(1 + next() * 8),
    focus: next(),
    risk: next(),
  }));
</script>
</body>
</html>
